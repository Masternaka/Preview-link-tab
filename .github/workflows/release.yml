name: Publication automatique

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - package.json
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Déterminer la version à publier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Vérifier le changement de version et la release existante
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-plan.js

  validation:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    name: Publier les extensions validées
    needs: [version, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Récupérer les archives validées
        uses: actions/download-artifact@v8
        with:
          name: preview-link-tab-packages
          path: packages
      - name: Vérifier les archives puis publier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd packages && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2> release-error.log; then
            if node -e 'process.exit(JSON.parse(require("fs").readFileSync("release-state.json")).isDraft ? 0 : 1)'; then
              gh release upload "$RELEASE_TAG" packages/*.zip packages/SHA256SUMS --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              echo "Release déjà publiée : aucun fichier remplacé."
            fi
          else
            gh release create "$RELEASE_TAG" packages/*.zip packages/SHA256SUMS --target "$RELEASE_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
